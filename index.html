<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Signel.js Landing</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0f172a;
  --card: #111827;
  --accent: #6366f1;
  --text: #e5e7eb;
  --muted: #9ca3af;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: linear-gradient(180deg, #020617, #0f172a);
  color: var(--text);
}

/* Layout */
section {
  padding: 6rem 1.5rem;
  max-width: 1100px;
  margin: auto;
}

.hero {
  text-align: center;
  padding-top: 8rem;
}

.hero h1 {
  font-size: clamp(2.5rem, 5vw, 4rem);
  font-weight: 700;
}

.hero span {
  color: var(--accent);
}

.hero p {
  max-width: 600px;
  margin: 1.5rem auto;
  color: var(--muted);
  font-size: 1.1rem;
}

button {
  background: var(--accent);
  color: white;
  border: none;
  padding: 0.9rem 1.5rem;
  border-radius: 0.6rem;
  font-size: 1rem;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(99,102,241,.35);
}

/* Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
}

.card {
  background: linear-gradient(180deg, #020617, #020617) padding-box,
              linear-gradient(180deg, #6366f1, #22d3ee) border-box;
  border: 1px solid transparent;
  border-radius: 1rem;
  padding: 1.8rem;
}

.card h3 {
  margin-top: 0;
}

/* Counter */
.counter {
  font-size: 3rem;
  font-weight: 700;
  color: var(--accent);
}

/* Newsletter */
.newsletter {
  background: #020617;
  border-radius: 1rem;
  padding: 3rem;
  text-align: center;
}

input {
  padding: 0.8rem;
  border-radius: 0.5rem;
  border: none;
  width: 240px;
  margin-right: .5rem;
}

/* Footer */
footer {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--muted);
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>Build UI with <span>Signel.js</span></h1>
  <p>
    A tiny reactive JavaScript library for modern interfaces —
    no build tools, no virtual DOM, just signals.
  </p>
  <button id="ctaBtn">Get Started</button>
</section>

<!-- STATS -->
<section>
  <h2>Simple counter animation</h2>
  <div class="counter"></div>
</section>

<!-- FEATURES -->
<section>
  <h2>Why Signel?</h2>
  <div class="grid features"></div>
</section>

<!-- NEWSLETTER -->
<section class="newsletter">
  <h2>Stay in the loop</h2>
  <p>Get updates when new versions drop.</p>
  <input class="email" placeholder="you@example.com"/>
  <button class="subscribe">Subscribe</button>
  <p class="output"></p>
</section>

<footer>
  © 2026 Signel.js — MIT License
</footer>

<!-- Signel.js (your library) -->
<script src="./signel.js">
/* paste Signel.js here or include it as a separate file */
</script>

<script>
/* ---------------------------
   HERO INTERACTION
---------------------------- */
const clicks = state(0)

document.getElementById('ctaBtn').onclick = () => {
  clicks.val++
}

effect(() => {
  if (clicks.val > 0) {
    alert(`Thanks for your interest! (${clicks.val})`)
  }
})

/* ---------------------------
   COUNTER (Animated Effect)
---------------------------- */
const users = state(0)

users.root(document.body).render('.counter')

let i = 0
const interval = setInterval(() => {
  users.val = i
  i += 120
  if (i > 12000) clearInterval(interval)
}, 30)

/* ---------------------------
   FEATURES (Array State)
---------------------------- */
const features = state([
  '⚡ Ultra-lightweight',
  '🧠 Simple reactivity',
  '🧩 Native Web Components',
  '💾 Built-in persistence',
  '🚫 No build step',
  '✨ Modern API'
], {
  showEach: text => `
    <div class="card">
      <h3>${text.split(' ')[0]}</h3>
      <p>${text.slice(2)}</p>
    </div>
  `
})

features
  .root(document.body)
  .render('.features')

/* ---------------------------
   NEWSLETTER FORM
---------------------------- */
const email = state('')

email
  .root(document.body)
  .render('.email')
  .render('.output')

document.querySelector('.subscribe').onclick = () => {
  email.val
    ? email.val = 'Thanks for subscribing 🎉'
    : email.val = 'Please enter a valid email'
}
</script>

</body>
</html>
